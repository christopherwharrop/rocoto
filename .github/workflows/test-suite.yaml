# SPDX-License-Identifier: Apache-2.0

name: TestSuite

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  test-rocoto-amd64:
    name: Test with Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      packages: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.0', '3.1', '3.2', '3.3']
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      -
        name: Clean up any existing containers from previous runs
        run: |
          # Stop and remove any containers from previous runs
          cd docker
          docker compose -f docker-compose.yml down --remove-orphans --volumes || true
      -
        name: Prune pre-loaded GHA docker images
        run: |
          docker images
          docker image prune -a -f
          docker images
      -
        name: Start Slurm cluster containers
        run: |
          cd docker
          export DOCKER_CLIENT_TIMEOUT=600
          export COMPOSE_HTTP_TIMEOUT=600
          docker compose version
          docker compose -f docker-compose.yml config
          docker images
          docker ps -a
          docker compose -f docker-compose.yml up -d
      -
        name: Install Ruby ${{ matrix.ruby-version }} and dependencies
        run: |
          docker exec frontend bash -c "sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libreadline-dev zlib1g-dev libxml2-dev curl git"
          docker exec frontend bash -c "git clone https://github.com/rbenv/ruby-build.git /tmp/ruby-build"
          docker exec frontend bash -c "sudo /tmp/ruby-build/install.sh"
          docker exec frontend bash -c "LATEST=\$(ruby-build --definitions | grep -E '^${{ matrix.ruby-version }}\.[0-9]+\$' | tail -1); sudo ruby-build \$LATEST /usr/local/ruby-${{ matrix.ruby-version }}"
          docker exec frontend bash -c "sudo ln -sf /usr/local/ruby-${{ matrix.ruby-version }}/bin/ruby /usr/local/bin/ruby"
          docker exec frontend bash -c "sudo ln -sf /usr/local/ruby-${{ matrix.ruby-version }}/bin/gem /usr/local/bin/gem"
          docker exec frontend bash -c "ruby --version"
      -
        name: Copy test files to work directory
        run: |
          docker exec frontend bash -l -c "mkdir -p work; cd work; cp -r ../rocoto/* ."
      -
        name: Install rocoto
        run: |
          docker exec frontend bash -l -c "cd work; ./INSTALL --with-ruby=/usr/local/ruby-${{ matrix.ruby-version }} --local"
          docker exec frontend bash -l -c "cd work; ./UNINSTALL"
          docker exec frontend bash -l -c "cd work; ./INSTALL --with-ruby=/usr/local/ruby-${{ matrix.ruby-version }}"
      -
        name: Run test suite
        run: |
          docker exec frontend bash -l -c "cd work; bin/rocotorun -h"
